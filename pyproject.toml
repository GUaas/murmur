[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "muddywater-murmur"
version = "0.1.0"
description = "Training, evaluation, and inference code for the Murmur language model."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2,<3.0",
  "PyYAML>=6.0,<7.0",
  "tqdm>=4.66,<5.0",
  "numpy>=1.23,<3.0",
  "tokenizers>=0.20,<1.0",
  "sentencepiece>=0.2,<0.3",
]

[tool.setuptools.packages.find]
include = ["muddywater*"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
reports = ["matplotlib>=3.8,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
